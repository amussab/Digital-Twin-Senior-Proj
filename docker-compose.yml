# One command:  docker compose up -d backend      -> http://localhost:5080/
# AI engine:    docker compose --profile ai run --rm ai-engine            (selftest)
# Notebook:     docker compose --profile notebook up notebook             -> http://localhost:8888/
#
# C5 (LAN-only, no cloud): a plain "5080:5080" publishes on ALL host interfaces. To bind one
# interface, put its address in front, e.g.  "192.168.1.50:5080:5080/tcp"  and  "192.168.1.50:5005:5005/udp".
# The backend's PrivateNetworkGuard also returns 403 to non-private client addresses.
# Note: Docker Desktop NATs published ports, so the guard sees the Docker gateway address as the client.
services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: dt-backend:integration
    ports:
      - "5080:5080/tcp"
      - "5005:5005/udp"
    environment:
      Backend__Replay__Enabled: "true"
      Backend__Replay__Source: "${DT_SOURCE:-demo}"      # demo | twin-sim | synthetic
      Backend__Replay__RateHz: "${DT_RATE_HZ:-10}"
      Backend__Replay__Loop: "true"
    healthcheck:
      # the aspnet image has no curl/wget: use a bash /dev/tcp probe (CMD-SHELL would run dash)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5080 && printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  ai-engine:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: docker/ai-engine.Dockerfile
    image: dt-ai-engine:integration
    volumes:
      - ./AI-engine/data:/work/AI-engine/data:ro     # raw/cached public datasets (git-ignored, not in the image)
    command: ["python", "app.py", "selftest"]

  notebook:
    profiles: ["notebook"]
    build:
      context: .
      dockerfile: docker/ai-engine.Dockerfile
    image: dt-ai-engine:integration
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./AI-engine/notebooks:/work/AI-engine/notebooks
      - ./AI-engine/data:/work/AI-engine/data:ro
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--ServerApp.token=", "--ServerApp.password=", "--notebook-dir=/work/AI-engine/notebooks"]
